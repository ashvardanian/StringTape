name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  hooks:
    name: Check Release Commit
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check the Release Commit
        run: .github/scripts/check-release.sh "$GITHUB_REF_NAME"

  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test `std`
        run: cargo test
      - name: Test `no_std`
        run: cargo test --no-default-features
      - name: Test docs
        run: cargo test --doc

  publish_rust:
    name: Publish to crates.io
    runs-on: ubuntu-26.04
    needs: [hooks, test]
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io
        id: crates_io
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ steps.crates_io.outputs.token }}
          dry-run: false
