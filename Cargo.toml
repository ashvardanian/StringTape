[package]
name = "stringtape"
version = "2.5.0"
edition = "2021"
rust-version = "1.100" # `core::alloc::Allocator` and `alloc::alloc::Global` stabilized here
authors = ["Ash Vardanian <1983160+ashvardanian@users.noreply.github.com>"]
description = "A tape class for strings arrays compatible with Apache Arrow"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ashvardanian/StringTape"
documentation = "https://docs.rs/stringtape"
homepage = "https://github.com/ashvardanian/StringTape"
keywords = ["arrow", "strings", "no-std", "tape", "storage"]
categories = ["data-structures", "no-std"]
exclude = [".github/", ".vscode/"]

[lib]
path = "stringtape.rs"

[dev-dependencies]
arrow = { version = "59.1.0", default-features = false }

[features]
default = ["std"]
std = []

[[bin]]
name = "bench_vec_string"
path = "stringtape.rs"

[[bin]]
name = "bench_vec_slice"
path = "stringtape.rs"

[[bin]]
name = "bench_chars_slices"
path = "stringtape.rs"

[[bin]]
name = "bench_chars_tape"
path = "stringtape.rs"
