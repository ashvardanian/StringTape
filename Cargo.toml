[package]
name = "stringtape"
version = "2.4.1"
edition = "2021"
authors = ["Ash Vardanian <1983160+ashvardanian@users.noreply.github.com>"]
description = "A tape class for strings arrays compatible with Apache Arrow"
license = "Apache-2.0"
keywords = ["arrow", "strings", "no-std", "tape", "storage"]
categories = ["data-structures", "no-std"]

[lib]
path = "stringtape.rs"

[dependencies]
allocator-api2 = { version = "0.4", default-features = false, features = [
    "alloc",
] }

[dev-dependencies]
arrow = { version = "59", default-features = false }

[features]
default = ["std"]
std = ["allocator-api2/std"]

[[bin]]
name = "bench_vec_string"
path = "stringtape.rs"

[[bin]]
name = "bench_vec_slice"
path = "stringtape.rs"

[[bin]]
name = "bench_chars_slices"
path = "stringtape.rs"

[[bin]]
name = "bench_chars_tape"
path = "stringtape.rs"
